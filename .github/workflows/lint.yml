# GitHub Actions Workflow for Code Quality Enforcement
# Purpose: Run linting, formatting, type checking, and coverage validation
# Triggers: Push and pull requests to main/develop branches
# Prevents merging of code violating quality standards

name: Code Quality

# Trigger workflow on push and pull request events for main and develop branches
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Define workflow jobs
jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate coverage and blame
      
      # Step 2: Set up Python environment with caching
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # Cache pip dependencies for faster builds
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      
      # Step 3: Install production dependencies (required for coverage analysis)
      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Step 4: Install development dependencies (ruff, mypy, pytest-cov)
      - name: Install development dependencies
        run: |
          pip install ruff mypy pytest pytest-cov
      
      # Step 5: Run Ruff linter with GitHub-compatible output format
      # This enables inline PR annotations for linting issues
      - name: Run Ruff linter
        run: |
          ruff check . --output-format=github
        continue-on-error: false  # Fail workflow if linting errors found
      
      # Step 6: Run Ruff formatter check to validate consistent code formatting
      # Uses --check flag to verify formatting without modifying files
      - name: Check code formatting with Ruff
        run: |
          ruff format --check .
        continue-on-error: false  # Fail workflow if formatting issues found
      
      # Step 7: Run Mypy static type checker
      # Analyzes tests/, mcp_servers/, and llm/ directories for type safety
      - name: Run Mypy type checker
        run: |
          mypy tests/ mcp_servers/ llm/ --ignore-missing-imports --no-error-summary
        continue-on-error: false  # Fail workflow if type errors found
      
      # Step 8: Run pytest with coverage validation (≥70% threshold)
      # Generates term and XML reports for human and machine consumption
      - name: Run tests with coverage validation
        run: |
          pytest tests/ \
            --cov=tests \
            --cov=mcp_servers \
            --cov=llm \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=70
        continue-on-error: false  # Fail workflow if coverage below 70%
      
      # Step 9: Upload coverage report to Codecov (optional)
      # Only runs if CODECOV_TOKEN secret is configured
      # Uses if: always() to upload even if previous steps failed
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false  # Don't fail CI if Codecov upload fails
          verbose: true
        continue-on-error: true  # Optional step, don't block workflow
      
      # Step 10: Upload coverage HTML report as artifact for manual inspection
      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30
