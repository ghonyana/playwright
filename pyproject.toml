# Modern Python project configuration following PEP 517/518 standards
# Enterprise-ready test automation framework with pytest, Playwright, BDD, and MCP integration

[build-system]
# Use hatchling as the build backend for modern Python packaging
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Project metadata
name = "playwright-test-automation-framework"
version = "0.1.0"
description = "Enterprise-ready Python test automation framework combining pytest, Playwright, BDD, and MCP integration"
readme = "README.md"
requires-python = ">=3.9"  # Playwright 1.55.0 requires Python 3.9+
license = {text = "MIT"}
authors = [
    {name = "Blitzy Team", email = "team@blitzy.com"}
]
keywords = [
    "testing",
    "automation",
    "playwright",
    "pytest",
    "bdd",
    "gherkin",
    "pytest-bdd",
    "mcp",
    "llm",
    "test-framework",
    "api-testing",
    "ui-testing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Framework :: Pytest",
]

# Core production dependencies with pinned versions for reproducibility
dependencies = [
    "pytest==8.4.2",              # Core test framework
    "pytest-bdd==8.1.0",          # BDD/Gherkin support
    "playwright==1.55.0",         # Browser automation (requires Python 3.9+)
    "pytest-playwright==0.6.2",   # Playwright pytest integration
    "httpx==0.28.1",              # Modern HTTP client for API testing
    "pydantic==2.10.5",           # Data validation and typing
    "allure-pytest==2.15.0",      # Allure reporting integration
    "python-dotenv==1.0.1",       # Environment variable management
    "pytest-asyncio==0.25.2",     # Async test support
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "ruff==0.9.3",                # Fast Python linter and formatter
    "mypy==1.14.1",               # Static type checker
    "pre-commit==4.0.1",          # Git pre-commit hook framework
    "pytest-cov==6.0.0",          # Code coverage reporting
    "pytest-xdist==3.6.1",        # Parallel test execution
    "faker==34.2.0",              # Test data generation
]

# MCP server dependencies (optional for deterministic testing)
mcp = [
    "fastapi==0.118.0",           # FastAPI MCP server framework
    "uvicorn[standard]==0.34.0",  # ASGI server with extras
    "pydantic-settings==2.7.0",   # Settings management
    "python-jose==3.3.0",         # JWT token handling
    "passlib==1.7.4",             # Password hashing
    "python-multipart==0.0.20",   # Form data parsing
    "sqlalchemy==2.0.38",         # Database ORM (optional)
    "alembic==1.14.3",            # Database migrations (optional)
    "websockets==14.1",           # WebSocket support
]

# LLM integration dependencies (optional for test generation)
llm = [
    "openai==1.59.8",             # OpenAI API client
    "ollama==0.4.8",              # Ollama local LLM client
    "tiktoken==0.9.0",            # Token counting
]

[project.urls]
Homepage = "https://github.com/blitzy/playwright-test-automation-framework"
Repository = "https://github.com/blitzy/playwright-test-automation-framework"
Documentation = "https://github.com/blitzy/playwright-test-automation-framework/docs"
Issues = "https://github.com/blitzy/playwright-test-automation-framework/issues"

# ============================================================================
# PYTEST CONFIGURATION
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Default test execution options
addopts = [
    "-v",                         # Verbose output
    "--strict-markers",           # Fail on unknown markers
    "--tb=short",                 # Short traceback format
]

# Custom test markers for categorization and selective execution
markers = [
    "bdd: BDD/Gherkin scenario tests",
    "ui: UI tests using Playwright",
    "api: API tests using httpx",
    "integration: Integration tests",
    "smoke: Smoke tests for critical paths",
    "slow: Tests that take longer to execute",
]

# BDD feature file configuration for pytest-bdd
bdd_features_base_dir = "tests/features"

# ============================================================================
# COVERAGE CONFIGURATION
# ============================================================================
[tool.coverage.run]
# Source directories to measure coverage
source = ["tests", "mcp_servers", "llm"]

# Patterns to exclude from coverage
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

branch = true  # Measure branch coverage

[tool.coverage.report]
# Lines to exclude from coverage reporting
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

precision = 2
show_missing = true

# ============================================================================
# MYPY TYPE CHECKING CONFIGURATION
# ============================================================================
[tool.mypy]
python_version = "3.9"            # Target Python 3.9 for compatibility
strict = true                     # Enable all strict type checking options
warn_return_any = true            # Warn about returning Any
warn_unused_configs = true        # Warn about unused config options
disallow_untyped_defs = true      # Disallow functions without type annotations
disallow_incomplete_defs = true   # Disallow partially typed functions
check_untyped_defs = true         # Type check untyped function bodies
no_implicit_optional = true       # Don't assume Optional for None default
warn_redundant_casts = true       # Warn about unnecessary casts
warn_unused_ignores = true        # Warn about unused type: ignore comments
warn_no_return = true             # Warn about functions that don't return
strict_equality = true            # Strict equality checks

# Third-party libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "pytest_bdd.*",
    "playwright.*",
    "allure.*",
    "faker.*",
]
ignore_missing_imports = true

# ============================================================================
# RUFF LINTING AND FORMATTING CONFIGURATION
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py39"           # Target Python 3.9 syntax

# Directories to exclude from linting
extend-exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
# Rule categories to enable
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
]

# Rules to ignore
ignore = [
    "E501",  # Line too long (handled by formatter)
]

# Per-file rule ignores
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]           # Unused imports in __init__.py
"tests/**/*.py" = ["S101"]         # Allow assert statements in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
