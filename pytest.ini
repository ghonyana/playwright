# pytest Configuration File
# Test Automation Framework - pytest, pytest-bdd, Playwright, and httpx Integration
# This configuration file defines test discovery, execution, and reporting settings

[pytest]
# ============================================================================
# Minimum Version Requirements
# ============================================================================
minversion = 8.0

# ============================================================================
# Test Discovery Patterns
# ============================================================================
# Define where pytest should look for tests and how to identify them
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# ============================================================================
# BDD Configuration (pytest-bdd)
# ============================================================================
# Configure pytest-bdd to discover Gherkin .feature files
# Features should be organized in tests/features/ directory
bdd_features_base_dir = tests/features

# ============================================================================
# Playwright Configuration
# ============================================================================
# Playwright settings can be overridden via environment variables:
#   BASE_URL          - Web application base URL (default: http://localhost:3000)
#   API_BASE_URL      - REST API base URL (default: http://localhost:8000)
#   HEADLESS          - Run browsers in headless mode (default: true)
#   BROWSER           - Browser to use: chromium, firefox, webkit (default: chromium)
#   SLOWMO            - Slow down operations by N milliseconds (default: 0)

# Default base URL for Playwright page.goto() calls
# Override with BASE_URL environment variable or --base-url flag
base_url = http://localhost:3000

# Note: Browser selection, headless mode, and other Playwright options
# are configured via command-line flags (--browser, --headed) or environment variables
# rather than pytest.ini to maintain compatibility with pytest-playwright

# ============================================================================
# Default Command-Line Options (addopts)
# ============================================================================
# These options are automatically applied to every pytest run
# Individual options can be overridden on the command line
addopts =
    -v
    --tb=short
    --strict-markers
    -ra
    --color=yes
    -n auto
    --dist loadscope
    --alluredir=allure-results
    --clean-alluredir
    --strict-config
    --show-capture=no

# ============================================================================
# Custom Test Markers
# ============================================================================
# Register custom markers to categorize and filter tests
# Usage examples:
#   pytest -m ui                    # Run only UI tests
#   pytest -m "not slow"            # Skip slow tests
#   pytest -m "api and smoke"       # Run API smoke tests
markers =
    ui: UI tests using Playwright for browser automation
    api: API tests using httpx for REST API testing
    bdd: BDD tests with Gherkin scenarios and pytest-bdd
    integration: End-to-end integration tests spanning multiple systems
    smoke: Smoke tests for critical paths and core functionality
    slow: Tests that take longer to execute (> 10 seconds)
    fast: Fast tests suitable for pre-commit hooks (< 2 seconds)
    requires_mcp: Tests that require MCP server to be running
    requires_llm: Tests that require LLM provider access
    local_only: Tests that only run in local development environment
    ci_only: Tests that only run in CI/CD pipeline

# ============================================================================
# Async Test Configuration
# ============================================================================
# Configure pytest-asyncio for async test support
# asyncio_mode = auto: Automatically detect async tests
# asyncio_default_fixture_loop_scope = session: Use session-scoped event loop for fixtures
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

# ============================================================================
# Warning Filters
# ============================================================================
# Control which warnings are displayed during test execution
# Format: action:message:category:module:line
filterwarnings =
    # Ignore common deprecation warnings from dependencies
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    
    # Convert specific warnings to errors to catch issues early
    error::UserWarning
    
    # Ignore specific third-party library warnings
    ignore:.*unclosed.*:ResourceWarning
    ignore:.*coroutine.*was never awaited.*:RuntimeWarning

# ============================================================================
# Console Output Configuration
# ============================================================================
# Configure how pytest displays output in the console
console_output_style = progress
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# File logging configuration (optional)
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ============================================================================
# Test Timeout Configuration (pytest-timeout)
# ============================================================================
# Global timeout to prevent tests from hanging indefinitely
# 300 seconds = 5 minutes per test (override with @pytest.mark.timeout)
timeout = 300
timeout_method = thread

# ============================================================================
# xfail Configuration
# ============================================================================
# Control behavior of expected failure markers
# xfail tests that pass unexpectedly will fail
xfail_strict = true

# ============================================================================
# Collection Configuration
# ============================================================================
# Configure test collection behavior
norecursedirs = .git .tox dist build *.egg venv node_modules __pycache__

# Don't collect tests from these patterns
# Useful for excluding example files, documentation, etc.
# python_ignore = setup.py conftest.py

# ============================================================================
# Live Logging Configuration
# ============================================================================
# Enable live logging to see log output in real-time during test execution
# Useful for debugging long-running tests
# Disabled by default to reduce noise - enable with --log-cli command line flag
