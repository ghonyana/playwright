<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Test Automation Framework</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <h1>Test Automation Framework</h1>
        <nav role="navigation">
            <a href="/dashboard">Dashboard</a>
            <a href="/users">Users</a>
            <a href="/settings">Settings</a>
            <a href="/reports">Reports</a>
            <div data-testid="user-menu">
                <button aria-label="User Menu">{{ user.name or user.email }}</button>
                <div class="dropdown-menu">
                    <a href="/profile">Profile</a>
                    <a href="/logout" role="menuitem">Logout</a>
                </div>
            </div>
        </nav>
    </header>
    
    <main role="main">
        <!-- Breadcrumb navigation with 4 levels -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb" data-testid="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="/dashboard" data-testid="breadcrumb-dashboard">Dashboard</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="/users" data-testid="breadcrumb-users">Users</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="/users/{{ profile_user.id }}" data-testid="breadcrumb-user-profile">User Profile</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page" data-testid="breadcrumb-edit-profile">
                    Edit Profile
                </li>
            </ol>
        </nav>
        
        <h2 data-testid="page-title">Edit Profile</h2>
        
        <div class="profile-edit-container">
            <form method="POST" action="/users/{{ profile_user.id }}/update" class="profile-edit-form">
                <div class="form-group">
                    <label for="user-id">User ID (read-only):</label>
                    <input type="text" id="user-id" name="user_id" value="{{ profile_user.id }}" readonly>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" value="{{ profile_user.email }}" required
                           data-testid="email-input">
                </div>
                
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" value="{{ profile_user.name }}" required
                           data-testid="name-input">
                </div>
                
                <div class="form-group">
                    <label for="role">Role:</label>
                    <select id="role" name="role" data-testid="role-select">
                        <option value="admin" {% if profile_user.role == 'admin' %}selected{% endif %}>Admin</option>
                        <option value="user" {% if profile_user.role == 'user' %}selected{% endif %}>User</option>
                        <option value="viewer" {% if profile_user.role == 'viewer' %}selected{% endif %}>Viewer</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Created At (read-only):</label>
                    <input type="text" value="{{ profile_user.created_at[:10] if profile_user.created_at != 'N/A' else 'N/A' }}" readonly>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" data-testid="save-button">
                        Save Changes
                    </button>
                    <a href="/users/{{ profile_user.id }}" class="btn btn-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2024 Test Automation Framework - Sample Application</p>
    </footer>
</body>
</html>
